<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><meta name="color-scheme" content="dark"><meta name="z19-version" content="2.16"><title>Portfólio — Zero 19</title><link rel="icon" href="/zero19-logo.png?v=2.16-logo2" type="image/png"><meta name="description" content="Projetos e personalizações produzidos pela Zero 19.">
<style>
:root{--bg:#09090b;--panel:#121215;--line:#2a2b31;--text:#f7f7f8;--muted:#9a9aa5;--accent:#ff6428;--accent2:#ff8a3d}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 88% -7%,rgba(255,100,40,.17),transparent 30%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}.top{position:sticky;top:0;z-index:20;background:rgba(9,9,11,.88);backdrop-filter:blur(18px);border-bottom:1px solid #222229}.topin{width:min(1180px,100%);margin:auto;display:flex;align-items:center;gap:14px;padding:12px 20px}.logo{width:126px;height:40px;object-fit:contain;object-position:center;background:#fff;border-radius:10px;padding:6px;filter:none}.spacer{flex:1}.btn{border:1px solid var(--line);background:#17171b;color:#fff;border-radius:13px;padding:10px 13px;font-weight:800;text-decoration:none;cursor:pointer;display:inline-flex;gap:7px;align-items:center}.hero{width:min(1180px,100%);margin:auto;padding:60px 20px 34px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--accent2)}h1{font-size:clamp(42px,8vw,82px);line-height:.92;letter-spacing:-.055em;margin:12px 0 18px}.hero p{color:#c3c3ca;max-width:670px;line-height:1.65}.grid{width:min(1180px,100%);margin:auto;padding:0 20px 70px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.case{border:1px solid var(--line);background:linear-gradient(155deg,#151518,#0e0e11);border-radius:24px;overflow:hidden;box-shadow:0 22px 70px rgba(0,0,0,.32)}.head{padding:18px;display:flex;gap:12px;align-items:center}.company-logo{width:52px;height:52px;border:1px solid #303139;border-radius:14px;background:#f2f2f2;object-fit:contain;padding:5px}.company-fallback{width:52px;height:52px;border-radius:14px;background:#212127;display:grid;place-items:center;font-weight:950}.head-copy{min-width:0}.head-copy small{color:var(--muted);font-size:10px;display:block}.head-copy b{display:block;font-size:20px;margin-top:2px}.head-copy span{display:block;color:#c7c7cd;font-size:12px;margin-top:4px}.desc{padding:0 18px 18px;color:#aeb0b9;font-size:12px;line-height:1.55}.media{position:relative;background:#050506}.track{display:flex;overflow:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.track::-webkit-scrollbar{display:none}.slide{flex:0 0 100%;scroll-snap-align:center;display:grid;place-items:center;max-height:min(68dvh,720px);min-height:280px}.slide video,.slide img{display:block;width:100%;height:auto;max-height:min(68dvh,720px);object-fit:contain;background:#050506}.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(10,10,12,.78);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 10px;font-size:9px;font-weight:850;pointer-events:none}.empty,.error,.loading{width:min(700px,calc(100% - 32px));margin:80px auto;text-align:center;color:var(--muted)}.spinner{width:40px;height:40px;border:3px solid #292930;border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}.footer{text-align:center;border-top:1px solid #222228;padding:28px 20px 40px;color:#777;font-size:11px}.footer img{width:130px;max-height:44px;object-fit:contain;background:#fff;border-radius:10px;padding:6px;display:block;margin:0 auto 9px}
@media(max-width:760px){.topin{padding:10px 14px}.logo{width:128px}.hero{padding:38px 15px 24px}.grid{grid-template-columns:1fr;padding:0 12px 55px;gap:18px}.case{border-radius:20px}.slide,.slide video,.slide img{max-height:62dvh}.slide{min-height:220px}.head{padding:15px}.desc{padding:0 15px 15px}}
.case-actions{display:flex;gap:8px;align-items:center;padding:14px 18px 18px}.like-case.liked{border-color:#713c50;background:#24131a;color:#ff9bb8}.like-count{font-size:11px;color:var(--muted);font-weight:800}.sound-local{position:absolute;right:12px;bottom:12px;z-index:5;background:rgba(10,10,12,.8);backdrop-filter:blur(10px)}
</style></head><body><header class="top"><div class="topin"><img class="logo" src="/zero19-logo.png?v=2.16-logo2" alt="Zero 19"><div><b style="font-size:13px">Portfólio</b><small style="display:block;color:var(--muted);font-size:10px">Projetos reais</small></div><div class="spacer"></div><button class="btn" id="share">↗ Compartilhar</button></div></header><section class="hero"><div class="eyebrow">Zero 19 • Trabalhos realizados</div><h1>Projetos que já saíram do papel.</h1><p>Veja fotos e vídeos de personalizações produzidas para empresas e clientes. Cada projeto mostra como a arte ganha vida na peça.</p></section><main id="grid" class="grid"><div class="loading" style="grid-column:1/-1"><div class="spinner"></div>Carregando portfólio…</div></main><footer class="footer"><img src="/zero19-logo.png?v=2.16-logo2" alt="Zero 19">Personalização com identidade, acabamento e qualidade.</footer>
<script>
const U='https://kedggjyerexnzmipaick.supabase.co',K='sb_publishable_WoobBV7n0p5Jf-4DLJVzIA_4sUoAvsT',B='z19p-assets',EDGE=`${U}/functions/v1/z19p-quality-public`;let observer;const g=document.getElementById('grid');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const url=p=>`${U}/storage/v1/object/public/${B}/${String(p||'').split('/').map(encodeURIComponent).join('/')}`;const q=new URLSearchParams(location.search),focus=q.get('c')||'';
function media(c){return (c.media||[]).map(m=>`<div class="slide">${m.type==='video'?`<video src="${url(m.path)}" muted loop playsinline preload="metadata" controls></video>`:`<img loading="lazy" src="${url(m.path)}" alt="${esc(c.product_name)}">`}</div>`).join('')}function syncPortfolioSound(v){const b=v?.closest('.case')?.querySelector('.sound-local');if(!b)return;b.textContent=v.muted?'🔇 Ativar som':'🔊 Som ligado'}
function render(data){const cs=data.cases||[];g.innerHTML=cs.length?cs.map(c=>{const liked=localStorage.getItem(`z19-port-like-${c.id}`)==='1';return `<article class="case" id="case-${c.share_token}" data-case="${c.id}"><div class="head">${c.company_logo_path?`<img class="company-logo" src="${url(c.company_logo_path)}" alt="Logo ${esc(c.company_name||'empresa')}">`:`<div class="company-fallback">${esc((c.company_name||'Z').slice(0,1).toUpperCase())}</div>`}<div class="head-copy"><small>${esc(c.company_name||'Projeto Zero 19')}</small><b>${esc(c.product_name)}</b><span>Personalização produzida pela Zero 19</span></div></div>${c.description?`<div class="desc">${esc(c.description)}</div>`:''}<div class="media"><div class="track">${media(c)||'<div class="slide" style="color:#777">Mídia não cadastrada</div>'}</div>${(c.media||[]).length>1?`<div class="hint">↔ Arraste para ver fotos e vídeos</div>`:''}${(c.media||[]).some(m=>m.type==='video')?`<button class="btn sound-local">🔇 Ativar som</button>`:''}</div><div class="case-actions"><button class="btn like-case ${liked?'liked':''}">♥ ${liked?'Curtido':'Curtir'}</button><span class="like-count">${Number(c.like_count)||0} curtida${Number(c.like_count)===1?'':'s'}</span><button class="btn share-case">↗ Compartilhar</button></div></article>`}).join(''):'<div class="empty" style="grid-column:1/-1"><h2>Portfólio em preparação</h2><p>Os primeiros projetos aparecerão aqui em breve.</p></div>';observer?.disconnect();const vids=[...document.querySelectorAll('video')];observer=new IntersectionObserver(es=>es.forEach(async e=>{const v=e.target;if(e.isIntersecting&&e.intersectionRatio>.58){vids.forEach(x=>x!==v&&x.pause());v.muted=false;try{await v.play()}catch{v.muted=true;v.play().catch(()=>{})}syncPortfolioSound(v)}else if(e.intersectionRatio<.3)v.pause()}),{threshold:[0,.3,.58,.8]});vids.forEach(v=>observer.observe(v));document.querySelectorAll('.sound-local').forEach(b=>b.onclick=async()=>{const v=b.closest('.case').querySelector('video');if(!v)return;if(v.muted){v.muted=false;try{await v.play()}catch{}}else v.muted=true;syncPortfolioSound(v)});document.querySelectorAll('.like-case').forEach(b=>b.onclick=async()=>{const card=b.closest('.case'),caseId=card.dataset.case;b.disabled=true;try{const r=await fetch(EDGE,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'portfolio_like',site:'zero19',case_id:caseId})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha ao curtir');localStorage.setItem(`z19-port-like-${caseId}`,'1');b.classList.add('liked');b.textContent='♥ Curtido';card.querySelector('.like-count').textContent=`${d.count||0} curtida${Number(d.count)===1?'':'s'}`}catch(e){alert(e.message||'Não foi possível curtir.')}finally{b.disabled=false}});document.querySelectorAll('.share-case').forEach(b=>b.onclick=async()=>{const card=b.closest('.case'),u=`${location.origin}${location.pathname}?c=${encodeURIComponent(card.id.replace('case-',''))}`;if(navigator.share){try{return await navigator.share({title:'Portfólio Zero 19',url:u})}catch(e){if(e?.name==='AbortError')return}}navigator.clipboard?.writeText(u)});if(focus){setTimeout(()=>document.getElementById(`case-${CSS.escape(focus)}`)?.scrollIntoView({behavior:'smooth',block:'center'}),200)}}
async function load(){try{const r=await fetch(`${U}/rest/v1/rpc/z19p_get_portfolio_catalog`,{method:'POST',headers:{apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json'},body:JSON.stringify({p_slug:'zero19'}),cache:'no-store'});if(!r.ok)throw new Error('Não foi possível carregar o portfólio.');render(await r.json())}catch(e){g.innerHTML=`<div class="error" style="grid-column:1/-1"><h2>Não foi possível carregar</h2><p>${esc(e.message)}</p></div>`}}
document.getElementById('share').onclick=async()=>{const u=location.href;if(navigator.share){try{await navigator.share({title:'Portfólio Zero 19',url:u});return}catch(e){if(e?.name==='AbortError')return}}try{await navigator.clipboard.writeText(u);alert('Link copiado.')}catch{prompt('Copie o link:',u)}};load();
</script></body></html>

<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Local image performance fixture</title><body><div id="preview"></div><script type="module">
import {replacePreviewMarkup} from '../asset-preview.js';
import {openFilmAssetPicker} from '../film-picker.js';
import {mountFilmPreview} from '../film-preview.js';
const svg='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="red"/></svg>');
const records=Array.from({length:40},(_,n)=>({id:'asset-'+n,asset_type:'arte',name:'Arte '+n,workspace_id:'company',original_path:'original-'+n,thumbnail_path:'thumb-'+n}));
const profiles=records.map(a=>({asset_id:a.id,ready_for_print:true,default_width_cm:10,default_height_cm:10}));
const requested=[],added=[];
const picker=openFilmAssetPicker({profiles,assetMap:new Map(records.map(a=>[a.id,a])),workspaces:[{id:'company',company_name:'Teste local'}],publicUrl:path=>{requested.push(path);return svg+'#'+path},onAdd:items=>added.push(...items)});
const q=s=>picker.element.querySelector(s);
const assert=(condition,message)=>{if(!condition)throw Error(message)};
const initial=[...picker.element.querySelectorAll('.fp-art-grid img')];
q('[data-action="quick"][data-id="asset-0"]').click();
assert(initial.every((image,index)=>image===picker.element.querySelectorAll('.fp-art-grid img')[index]),'Selecting one art must retain all 40 decoded image elements');
const quantity=q('[data-input="quantity"][data-id="asset-0"]');quantity.value='3';quantity.dispatchEvent(new Event('change',{bubbles:true}));
assert(initial.every((image,index)=>image===picker.element.querySelectorAll('.fp-art-grid img')[index]),'Quantity must retain images');
q('[data-action="toggle-tray"]').click();
const trayImage=q('.fp-selection-list img');q('[data-action="toggle-tray"]').click();q('[data-action="toggle-tray"]').click();
assert(q('.fp-selection-list img')===trayImage,'Tray toggle retains selected preview');
const search=q('[data-input="art-search"]');search.value='Arte 0';search.dispatchEvent(new Event('input',{bubbles:true}));
assert(q('.fp-art-grid img')===initial[0],'Filtering retains matching preview');
assert(requested.every(path=>path.startsWith('thumb-')),'Display only requests thumbnails');
q('[data-action="submit"]').click();
await new Promise(resolve=>setTimeout(resolve,0));
assert(added.length===1&&added[0].path==='original-0'&&added[0].quantity===3,'Added film item retains original production source');
const container=document.querySelector('#preview');replacePreviewMarkup(container,`<img src="${svg}" alt="one"><img src="${svg}" alt="two">`);
const pair=[...container.querySelectorAll('img')];replacePreviewMarkup(container,`<img src="${svg}" alt="updated"><img src="${svg}" alt="second">`);
assert(container.querySelectorAll('img')[0]===pair[0]&&container.querySelectorAll('img')[1]===pair[1],'Repeated URLs retain separate nodes');
assert(pair[0].alt==='updated','Retained image updates display attributes');
const config={profiles,assetMap:new Map(records.map(a=>[a.id,a])),workspaces:[{id:'company',company_name:'Teste local'}],publicUrl:()=>svg};
let forbiddenAdds=0;
const oldAccount=openFilmAssetPicker({...config,onAdd:()=>forbiddenAdds++});
oldAccount.element.querySelector('[data-action="quick"]').click();
const oldSubmit=oldAccount.element.querySelector('[data-action="submit"]');
window.dispatchEvent(new Event('z19:account-changing'));
assert(!oldAccount.element.isConnected&&oldAccount.selected.size===0,'Account change closes modal and clears selection');
oldSubmit.click();
assert(forbiddenAdds===0,'Detached old-account submit cannot add old assets');
let finishAdd,signal,lateToasts=0;
const busyPicker=openFilmAssetPicker({...config,onAdd:(_items,options)=>{signal=options.signal;return new Promise((_resolve,reject)=>finishAdd=()=>reject(Error('late failure')))},toast:()=>lateToasts++});
busyPicker.element.querySelector('[data-action="quick"]').click();busyPicker.element.querySelector('[data-action="submit"]').click();
window.dispatchEvent(new Event('z19:account-changing'));
assert(!busyPicker.element.isConnected&&signal.aborted,'Busy picker closes and aborts callback lifetime on account change');
finishAdd();await new Promise(resolve=>setTimeout(resolve,0));
assert(lateToasts===0&&!busyPicker.element.isConnected,'Late callback failure cannot redraw or notify the next account');
const filmContainer=document.createElement('section');filmContainer.innerHTML='<div><div data-preview-test></div></div>';document.body.append(filmContainer);
const filmElement=filmContainer.querySelector('[data-preview-test]');
const filmItems=[{localId:'one',type:'asset',path:'one',widthCm:10,heightCm:6,rotationPolicy:'90'},{localId:'two',type:'asset',path:'two',widthCm:10,heightCm:6,rotationPolicy:'90'}];
let filmLayout={filmWidthMm:580,lengthMm:160,cellMm:2,placements:[{id:'one',copy:0,label:'One',xMm:0,yMm:0,widthMm:100,heightMm:60,rotation:0},{id:'two',copy:0,label:'Two',xMm:120,yMm:0,widthMm:100,heightMm:60,rotation:0}]};
const mount=()=>mountFilmPreview({element:filmElement,layout:filmLayout,items:filmItems,publicUrl:path=>svg+'#'+path,validate:async placements=>({...filmLayout,placements}),onChange:next=>{filmLayout=next},onRepack:async()=>({...filmLayout,nestingSearchWarning:'Busca limitada: encaixe seguro mantido.'}),onDelete:async placement=>{filmLayout={...filmLayout,placements:filmLayout.placements.filter(p=>p.id!==placement.id)};mount()}});
mount();const filmImages=[...filmElement.querySelectorAll('img')];
let inspector=filmContainer.querySelector('#filmInspector');const zoom=inspector.querySelector('[data-zoom]');zoom.value='200';zoom.dispatchEvent(new Event('input'));
assert([...filmElement.querySelectorAll('img')].every((image,index)=>image===filmImages[index]),'Film zoom retains decoded image elements');
assert(filmImages[0].style.width==='240px','Film zoom still updates geometry');
const background=inspector.querySelector('[data-background]');background.value='black';background.dispatchEvent(new Event('change'));
assert(filmElement.querySelector('img')===filmImages[0]&&filmElement.querySelector('.film-sheet').dataset.background==='black','Film background preserves image and changes visual only');
filmElement.querySelector('[data-placement]').dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));
inspector.querySelector('[data-x]').value='2';inspector.querySelector('[data-position]').click();await new Promise(resolve=>setTimeout(resolve,0));
assert(filmElement.querySelector('img')===filmImages[0]&&filmLayout.placements[0].xMm===20,'Validated reposition preserves original image');
inspector.querySelector('[data-repack]').click();await new Promise(resolve=>setTimeout(resolve,0));
assert(inspector.querySelector('[data-help]').textContent==='Busca limitada: encaixe seguro mantido.'&&!inspector.querySelector('[data-help]').classList.contains('error'),'Validated bounded nesting warning remains visible without error status');
inspector.querySelector('[data-delete]').click();await new Promise(resolve=>setTimeout(resolve,0));
assert(filmLayout.placements.length===1&&filmElement.querySelector('img')===filmImages[1],'Delete/remount preserves remaining image node');
window.previewQA={ok:true,retainedGridImages:40,retainedSelectionImages:true,thumbnailOnly:true,originalExportPath:true,accountChangeCloses:true,staleAddBlocked:true,busyLifetimeAborted:true,filmZoomBackgroundPositionImagesRetained:true,filmDeleteRemountRetained:true,repackWarningVisible:true};
</script></body></html>

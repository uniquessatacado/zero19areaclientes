<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restauração de rota · fixture local</title><style>*{box-sizing:border-box}html{scroll-behavior:auto;overflow-anchor:none}body{margin:0;background:#111015;color:#f9f4ff;font:15px system-ui,sans-serif}#app{max-width:1000px;margin:auto;padding:20px}h1{font-size:25px;color:#ff8741}nav{display:flex;gap:10px;flex-wrap:wrap}button{padding:12px 16px;background:#30252f;color:#fff;border:1px solid #654834;border-radius:9px;cursor:pointer}.test-surface{margin-top:18px;background:repeating-linear-gradient(#241b21 0,#241b21 99px,#684526 100px);border:1px solid #5d3929;padding:18px}.late-image{display:block;max-width:100%;width:800px;height:auto}p{line-height:1.6;color:#c1b4c7}</style></head><body><main id="app"></main><script type="module">
import {createRouteViewportController} from '../route-viewport.js';
const KEY='fixture:route-position',CONFIG='fixture:route-next-render',route=()=>location.hash.replace(/^#/,'')||'/a',app=document.querySelector('#app');
if(!location.hash)history.replaceState(null,'',location.pathname+'#/a');
const controller=createRouteViewportController({getRoute:route,root:app,key:KEY});
let imageTimer=null,renderCount=0;let config={mode:'tall',imageDelay:4700};try{config={...config,...JSON.parse(sessionStorage.getItem(CONFIG)||'null')}}catch{}sessionStorage.removeItem(CONFIG);
const imageURL='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="7000"><rect width="800" height="7000" fill="#231b21"/><path d="M0 1400h800M0 2800h800M0 4200h800M0 5600h800" stroke="#ff792e" stroke-width="8"/><text x="32" y="80" fill="#fff" font-size="32">Imagem local com altura tardia</text></svg>');
function render(){clearTimeout(imageTimer);const ticket=controller.begin(route());renderCount++;app.innerHTML=`<h1>Rota ${route()}</h1><p>Teste local de scroll: nenhuma autenticação, nenhum dado externo.</p><nav><button data-route="/a">Abrir A</button><button data-route="/b">Abrir B</button><button data-rerender>Redesenhar a mesma rota</button></nav>${config.mode==='image-delay'?'<div class="test-surface" style="min-height:80px">A imagem ainda não forneceu altura…</div><img class="late-image" alt="Imagem sintética local">':`<div class="test-surface" style="height:${config.mode==='short'?100:5600}px">Conteúdo ${config.mode==='short'?'curto':'alto'}</div>`}`;
  for(const button of app.querySelectorAll('[data-route]'))button.onclick=()=>location.hash=button.dataset.route;app.querySelector('[data-rerender]').onclick=render;
  controller.complete(ticket);if(config.mode==='image-delay'){const image=app.querySelector('img');image.onload=()=>{window.fixture.imageLoaded=true};imageTimer=setTimeout(()=>{image.src=imageURL},config.imageDelay)}
  if(window.fixture){window.fixture.renderCount=renderCount;window.fixture.currentRoute=route();window.fixture.imageLoaded=false}
}
window.fixture={controller,KEY,CONFIG,get renderCount(){return renderCount},set renderCount(value){renderCount=value},currentRoute:route(),imageLoaded:false,rerender:render,nextReload(next){sessionStorage.setItem(CONFIG,JSON.stringify(next))},get saved(){return JSON.parse(sessionStorage.getItem(KEY)||'null')},scroll(y){window.scrollTo({top:y,left:0,behavior:'instant'})},navigate(path){config={mode:'tall'};location.hash=path},setConfig(next){config={...config,...next}},metrics(){return {route:route(),y:scrollY,height:document.documentElement.scrollHeight,viewport:innerHeight,saved:this.saved,navigation:performance.getEntriesByType('navigation')[0]?.type,imageLoaded:this.imageLoaded,renderCount}}};
window.addEventListener('hashchange',render);render();window.fixtureReady=true;
</script></body></html>

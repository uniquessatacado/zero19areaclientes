<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><title>Teste local 3D real</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/production-v217.css"><link rel="stylesheet" href="/film-picker.css"><link rel="stylesheet" href="/art-studio.css"><link rel="stylesheet" href="/garment-composer.css"><link rel="stylesheet" href="/garment-3d.css"><link rel="stylesheet" href="/production-finance.css"><link rel="stylesheet" href="/production-cost-ui.css"><link rel="stylesheet" href="/film-preview.css"><link rel="stylesheet" href="/project-history.css"><link rel="stylesheet" href="/project-advisor.css"><link rel="stylesheet" href="/project-advisor-ui.css"><link rel="stylesheet" href="/customization-preparer.css"><link rel="stylesheet" href="/ui-polish.css"></head><body style="margin:0;background:#111;color:#fff;font-family:Arial"><h1>Fixture isolada 3D — sem conta nem banco</h1><button id="start">Abrir 3D</button><script type="module">
import {openGarment3D} from '/garment-3d.js';
const urls={},colors={front:'#ff7000',back:'#009dff',left:'#20bf63',right:'#df2ad9'};
for(const [side,color] of Object.entries(colors)){const canvas=document.createElement('canvas');canvas.width=400;canvas.height=200;const g=canvas.getContext('2d');g.fillStyle=color;g.fillRect(0,0,400,200);g.fillStyle='#fff';g.font='bold 57px Arial';g.textAlign='center';g.fillText(side.toUpperCase(),200,120);urls[side]=canvas.toDataURL()}
const scene={title:'Modelo 3D real · teste',model:'oversized',color:'offwhite',measurements:{bodyWidth:64,bodyLength:76,sleeveWidth:24,sleeveLength:27},layers:Object.keys(colors).map(side=>({id:side,assetId:side,name:side,path:side,side,width:side==='front'||side==='back'?26:12,ratio:2,x:side==='front'||side==='back'?32:12,y:side==='front'||side==='back'?25:10}))};
let viewer;const downloads=[],originalCreate=URL.createObjectURL;URL.createObjectURL=function(blob){const url=originalCreate(blob);downloads.push({blob,url});return url};HTMLAnchorElement.prototype.click=function(){};
window.fixture={scene,downloads,get viewer(){return viewer},async open(options={}){viewer=await openGarment3D({publicUrl:path=>urls[path]},scene,options);return true},click(selector){const node=document.querySelector(selector);if(!node)throw Error('Control absent: '+selector);node.click()},metrics(){const root=document.querySelector('.garment-3d'),r=root.getBoundingClientRect(),canvas=root.querySelector('canvas');return {overflow:document.documentElement.scrollWidth>innerWidth+1,dialogOverflow:root.scrollWidth>root.clientWidth+1,bounds:{x:r.x,y:r.y,width:r.width,height:r.height},canvas:{width:canvas?.width,height:canvas?.height},projected:root.parentElement.dataset.projected,missing:root.parentElement.dataset.missing}},async exportInfo(){const image=await createImageBitmap(downloads.at(-1).blob),canvas=document.createElement('canvas');canvas.width=image.width;canvas.height=image.height;const g=canvas.getContext('2d');g.drawImage(image,0,0);const result={width:image.width,height:image.height,creditStripPixel:[...g.getImageData(0,image.height-1,1,1).data]};image.close();canvas.width=canvas.height=1;return result}};

</script></body></html>

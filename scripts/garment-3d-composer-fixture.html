<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="art-studio.css"><link rel="stylesheet" href="garment-composer.css"></head><body><button id="fixtureStart">Abrir</button><script type="module">
import {openGarmentComposer} from '/garment-composer.js';
const owner='11111111-1111-4111-8111-111111111111',canvas=document.createElement('canvas');canvas.width=200;canvas.height=100;canvas.getContext('2d').fillRect(0,0,200,100);const image=canvas.toDataURL(),uploads=[],downloads=[];

  from(table){const q={select:()=>q,eq:()=>q,in:()=>q,maybeSingle:async()=>({data:null,error:null}),then:resolve=>resolve({data:table==='z19p_assets'?[asset]:[],error:null})};return q},

}};

function commissionSplitModal(c){if(!c||!['pending','approved'].includes(c.status))return toast('Esta comissão não pode mais ser dividida.','err');let parts=commissionSharesFor(c.id).map(x=>({user_id:x.recipient_user_id,percent:Number(x.share_percent)||0}));if(!parts.length)parts=[{user_id:c.seller_user_id,percent:100}];const bg=document.createElement('div');bg.className='modalbg';const render=()=>{bg.innerHTML=`<div class="modal compact"><div class="modalhead"><div><div class="eyebrow">Dividir comissão</div><h2>${money(c.commission_amount)}</h2><p class="hint">Distribua a comissão entre quem participou do atendimento. Os percentuais precisam somar 100%.</p></div><button class="btn close">×</button></div><div id="splitRows">${parts.map((p,i)=>`<div class="seller-rule"><div class="seller-rule-head"><select class="split-user" data-i="${i}">${profiles.map(u=>`<option value="${u.id}" ${u.id===p.user_id?'selected':''}>${esc(u.full_name)}${u.id===c.seller_user_id?' • vendedor original':''}</option>`).join('')}</select><button class="btn small danger remove-split" data-i="${i}" ${parts.length===1?'disabled':''}>Remover</button></div><div class="grid2" style="margin-top:8px"><div class="field"><label>Percentual</label><input class="split-percent" data-i="${i}" inputmode="decimal" value="${p.percent}"></div><div class="field"><label>Valor aproximado</label><input value="${money(Number(c.commission_amount||0)*Number(p.percent||0)/100)}" disabled></div></div></div>`).join('')}</div><div class="actions" style="margin-top:10px"><button class="btn small" id="addSplit">+ Adicionar pessoa</button><button class="btn small" id="equalSplit">Dividir igualmente</button></div><div class="notice" id="splitTotal" style="margin-top:12px"></div><div class="modalfoot">${commissionSharesFor(c.id).length?'<button class="btn danger" id="clearSplit">Remover divisão</button>':''}<div class="spacer"></div><button class="btn close">Cancelar</button><button class="btn primary" id="saveSplit">Salvar divisão</button></div></div>`;const sync=()=>{const vals=$$('.split-percent',bg).map(x=>Number(String(x.value).replace(',','.'))||0),sum=vals.reduce((a,b)=>a+b,0),el=$('#splitTotal',bg);el.textContent=`Total distribuído: ${sum.toLocaleString('pt-BR',{maximumFractionDigits:2})}% • ${money(Number(c.commission_amount||0)*sum/100)}`;el.style.borderColor=Math.abs(sum-100)<.01?'#285c40':'#6b3a31'};$$('.close',bg).forEach(x=>x.onclick=()=>bg.remove());$$('.split-user',bg).forEach(x=>x.onchange=()=>{parts[+x.dataset.i].user_id=x.value});$$('.split-percent',bg).forEach(x=>x.oninput=()=>{parts[+x.dataset.i].percent=Number(String(x.value).replace(',','.'))||0;sync()});$$('.remove-split',bg).forEach(x=>x.onclick=()=>{parts.splice(+x.dataset.i,1);render()});$('#addSplit',bg).onclick=()=>{const used=new Set(parts.map(x=>x.user_id)),next=profiles.find(x=>!used.has(x.id));if(!next)return toast('Todos os usuários já estão na divisão.','err');parts.push({user_id:next.id,percent:0});render()};$('#equalSplit',bg).onclick=()=>{const n=parts.length,base=Math.floor((100/n)*100)/100;parts.forEach((p,i)=>p.percent=i===n-1?Number((100-base*(n-1)).toFixed(2)):base);render()};$('#clearSplit',bg)?.addEventListener('click',async()=>{if(!confirm('Remover a divisão e devolver 100% da comissão ao vendedor original?'))return;const {error}=await supabase.rpc('z19p_set_commission_split',{p_commission_id:c.id,p_shares:[]});if(error)return err(error);bg.remove();toast('Divisão removida.','ok');await load()});$('#saveSplit',bg).onclick=async()=>{const clean=parts.map(x=>({user_id:x.user_id,percent:Number(x.percent)||0})).filter(x=>x.user_id&&x.percent>0),sum=clean.reduce((a,b)=>a+b.percent,0),ids=new Set(clean.map(x=>x.user_id));if(!clean.length)return toast('Adicione pelo menos um participante.','err');if(ids.size!==clean.length)return toast('O mesmo usuário não pode aparecer duas vezes.','err');if(Math.abs(sum-100)>.01)return toast('A divisão precisa somar 100%.','err');const {error}=await supabase.rpc('z19p_set_commission_split',{p_commission_id:c.id,p_shares:clean});if(error)return err(error);bg.remove();toast('Comissão dividida com sucesso.','ok');await load()};sync()};document.body.appendChild(bg);render()}
function commissionRuleModal(r=null){const bg=document.createElement('div');bg.className='modalbg';bg.innerHTML=`<form class="modal compact" id="ruleForm"><div class="modalhead"><div><div class="eyebrow">Comissão</div><h2>${r?'Editar':'Nova'} regra</h2></div><button type="button" class="btn close">×</button></div><div class="field"><label>Vendedor *</label><select name="seller" required>${profiles.filter(p=>p.role!=='admin'||profiles.length===1).map(p=>`<option value="${p.id}" ${r?.seller_user_id===p.id?'selected':''}>${esc(p.full_name)}</option>`).join('')}</select></div><div class="field"><label>Faixa de quantidade *</label><select name="tier" required>${tiers.map(t=>`<option value="${t.id}" ${r?.tier_id===t.id?'selected':''}>${esc(t.label)}</option>`).join('')}</select></div><div class="field"><label>Forma de comissão</label><select name="basis"><option value="total" ${r?.basis==='total'?'selected':''}>% do total</option><option value="product" ${r?.basis==='product'?'selected':''}>% somente da peça</option><option value="print" ${r?.basis==='print'?'selected':''}>% somente da estampa</option><option value="split" ${r?.basis==='split'?'selected':''}>% diferente peça + estampa</option></select></div><div class="grid3"><div class="field"><label>% Total</label><input name="total" inputmode="decimal" value="${r?.total_percent??0}"></div><div class="field"><label>% Peça</label><input name="product" inputmode="decimal" value="${r?.product_percent??0}"></div><div class="field"><label>% Estampa</label><input name="print" inputmode="decimal" value="${r?.print_percent??0}"></div></div><div class="modalfoot"><button type="button" class="btn close">Cancelar</button><button class="btn primary">Salvar</button></div></form>`;document.body.appendChild(bg);$$('.close',bg).forEach(x=>x.onclick=()=>bg.remove());$('#ruleForm',bg).onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),num=x=>Number(String(x||0).replace(',','.'))||0,row={owner_id:ownerId,seller_user_id:fd.get('seller'),tier_id:fd.get('tier'),basis:fd.get('basis'),total_percent:num(fd.get('total')),product_percent:num(fd.get('product')),print_percent:num(fd.get('print')),active:true,updated_at:new Date().toISOString()};const q=r?supabase.from('z19p_commission_rules').update(row).eq('id',r.id):supabase.from('z19p_commission_rules').upsert(row,{onConflict:'owner_id,seller_user_id,tier_id'});const out=await q;if(out.error)return err(out.error);bg.remove();await load()}}
function positionStyle(r){const w=Math.max(18,Math.min(110,Number(r.max_width_cm||9)*3)),h=Math.max(18,Math.min(120,Number(r.max_height_cm||9)*2.5)),p=String(r.placement||'').toLowerCase();let left=105-w/2,top=65;if(p.includes('esquerdo')){left=70-w/2;top=65}else if(p.includes('direito')){left=140-w/2;top=65}else if(p.includes('barriga')){top=135}else if(p.includes('manga direita')){left=175-w/2;top=60}else if(p.includes('manga esquerda')){left=35-w/2;top=60}else if(p.includes('nuca')){top=28}else if(p.includes('costas')||p.includes('mega costas')){top=75}else if(p.includes('mega frente')){top=75}return `left:${left}px;top:${top}px;width:${w}px;height:${h}px`}
function renderPrints(){view.innerHTML=hero('Estampas e criação de arte','Cadastre regras por tamanho, posição e faixa de quantidade. O orçamento usa essas regras para sugerir o valor automaticamente.',`<button class="btn primary" id="newPrintRule">+ Nova regra</button>`)+`<section class="panel settings-card"><div class="panelhead" style="padding:0 0 12px;border:0"><div><h2>Criação / preparação da arte</h2><p>PNG pronto e sem fundo pode ficar sem cobrança; caso contrário aplique a taxa por arte.</p></div></div><div class="grid2"><div class="field"><label>Valor por arte</label><input id="artFee" inputmode="decimal" value="${artFee.fee_per_art??30}"></div><div class="field"><label>Dar criação de brinde a partir da faixa</label><select id="artFreeTier"><option value="">Nunca automaticamente</option>${tiers.map(t=>`<option value="${t.id}" ${artFee.free_from_tier_id===t.id?'selected':''}>${esc(t.label)}</option>`).join('')}</select></div></div><div class="setting-row"><div><b>Cobrança de criação ativa</b><small>No orçamento o vendedor informa se a arte veio pronta.</small></div><label class="toggle"><input id="artFeeEnabled" type="checkbox" ${artFee.enabled!==false?'checked':''}><span></span></label></div><div class="modalfoot"><button class="btn primary" id="saveArtFee">Salvar criação de arte</button></div></section><section class="panel"><div class="panelhead"><div><h2>Regras de estampa</h2><p>Camisa normal por tamanho; camisa de time pode usar preço por caractere/número.</p></div></div><div class="tablewrap"><table class="table"><thead><tr><th>Regra</th><th>Tipo</th><th>Posição</th><th>Máximo</th><th>Modo</th><th>Ações</th></tr></thead><tbody>${printRules.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.garment_type==='team'?'Camisa de time':'Camisa normal'}</td><td>${esc(r.placement)}</td><td>${r.max_width_cm||'—'} × ${r.max_height_cm||'—'} cm</td><td>${esc(r.pricing_mode)}</td><td><div class="actions"><button class="btn small edit-print" data-id="${r.id}">Editar</button><button class="btn small danger del-print" data-id="${r.id}">Excluir</button></div></td></tr>`).join('')}</tbody></table></div></section>`;$('#newPrintRule').onclick=()=>printRuleModal();$('#saveArtFee').onclick=async()=>{const fee=Number(String($('#artFee').value).replace(',','.'))||0,r=await supabase.from('z19p_artwork_fee_settings').upsert({owner_id:ownerId,enabled:$('#artFeeEnabled').checked,fee_per_art:fee,free_from_tier_id:$('#artFreeTier').value||null,updated_at:new Date().toISOString(),updated_by:session.user.id});if(r.error)return err(r.error);toast('Criação de arte atualizada.','ok');await load()};$$('.edit-print').forEach(b=>b.onclick=()=>printRuleModal(printRules.find(x=>x.id===b.dataset.id)));$$('.del-print').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir esta regra?'))return;const r=await supabase.from('z19p_print_rules').delete().eq('id',b.dataset.id);if(r.error)return err(r.error);await load()})}
function printRuleModal(r=null){const prices=r?.z19p_print_rule_prices||[],bg=document.createElement('div');bg.className='modalbg';bg.innerHTML=`<form class="modal" id="printRuleForm"><div class="modalhead"><div><div class="eyebrow">Regra de estampa</div><h2>${r?'Editar':'Nova'} regra</h2></div><button type="button" class="btn close">×</button></div><div class="grid2"><div><div class="grid2"><div class="field full"><label>Nome *</label><input name="name" required value="${esc(r?.name||'')}"></div><div class="field"><label>Tipo de camisa</label><select name="garment_type"><option value="normal" ${r?.garment_type!=='team'?'selected':''}>Camisa normal</option><option value="team" ${r?.garment_type==='team'?'selected':''}>Camisa de time</option></select></div><div class="field"><label>Modo de cobrança</label><select name="pricing_mode"><option value="size" ${r?.pricing_mode==='size'?'selected':''}>Por tamanho</option><option value="per_character" ${r?.pricing_mode==='per_character'?'selected':''}>Por letra/número</option><option value="special" ${r?.pricing_mode==='special'?'selected':''}>Personalização especial</option></select></div><div class="field"><label>Posição</label><select name="placement">${['Peito esquerdo','Peito direito','Peito central','Barriga','Manga direita','Manga esquerda','Nuca','Costas','Mega frente','Mega costas'].map(x=>`<option ${r?.placement===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Ordem</label><input name="sort_order" inputmode="numeric" value="${r?.sort_order??nextOrder(printRules)}"></div><div class="field"><label>Largura máxima (cm)</label><input name="max_width_cm" inputmode="decimal" value="${r?.max_width_cm??9}"></div><div class="field"><label>Altura máxima (cm)</label><input name="max_height_cm" inputmode="decimal" value="${r?.max_height_cm??9}"></div></div></div><div class="mockup-editor"><div class="shirt"><div class="print-box" id="rulePreview" style="${positionStyle(r||{placement:'Peito esquerdo',max_width_cm:9,max_height_cm:9})}">ESTAMPA</div></div><div class="mockup-caption">Prévia aproximada de posição e proporção.</div></div></div><div style="margin-top:15px"><div class="eyebrow">Preços por faixa</div><div class="rule-price-grid">${tiers.map(t=>{const p=prices.find(x=>x.tier_id===t.id)||{};return `<div class="rule-tier"><b>${esc(t.label)}</b><div class="grid3"><div class="field"><label>Sozinha</label><input data-tier="${t.id}" data-price="standalone_price" inputmode="decimal" value="${p.standalone_price??''}"></div><div class="field"><label>Acompanhada</label><input data-tier="${t.id}" data-price="combined_price" inputmode="decimal" value="${p.combined_price??''}"></div><div class="field"><label>Especial</label><input data-tier="${t.id}" data-price="special_price" inputmode="decimal" value="${p.special_price??''}"></div><div class="field"><label>Por letra</label><input data-tier="${t.id}" data-price="char_price" inputmode="decimal" value="${p.char_price??''}"></div><div class="field"><label>Por número</label><input data-tier="${t.id}" data-price="number_price" inputmode="decimal" value="${p.number_price??''}"></div></div></div>`}).join('')}</div></div><div class="modalfoot"><button type="button" class="btn close">Cancelar</button><button class="btn primary">Salvar regra</button></div></form>`;document.body.appendChild(bg);const redraw=()=>{const fd=new FormData($('#printRuleForm',bg)),o={placement:fd.get('placement'),max_width_cm:fd.get('max_width_cm'),max_height_cm:fd.get('max_height_cm')};$('#rulePreview',bg).style.cssText=positionStyle(o)};$$('select[name=placement],input[name=max_width_cm],input[name=max_height_cm]',bg).forEach(x=>x.oninput=redraw);$$('.close',bg).forEach(x=>x.onclick=()=>bg.remove());$('#printRuleForm',bg).onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),num=x=>{const s=String(x||'').replace(',','.').trim();return s?Number(s):null},row={owner_id:ownerId,name:String(fd.get('name')).trim(),garment_type:fd.get('garment_type'),placement:fd.get('placement'),pricing_mode:fd.get('pricing_mode'),max_width_cm:num(fd.get('max_width_cm')),max_height_cm:num(fd.get('max_height_cm')),sort_order:Number(fd.get('sort_order')||0),active:true,updated_at:new Date().toISOString()};let id=r?.id;if(id){const out=await supabase.from('z19p_print_rules').update(row).eq('id',id);if(out.error)return err(out.error)}else{const out=await supabase.from('z19p_print_rules').insert(row).select().single();if(out.error)return err(out.error);id=out.data.id}const grouped={};$$('[data-tier][data-price]',bg).forEach(i=>{grouped[i.dataset.tier]??={owner_id:ownerId,rule_id:id,tier_id:i.dataset.tier};grouped[i.dataset.tier][i.dataset.price]=num(i.value)});for(const x of Object.values(grouped)){const out=await supabase.from('z19p_print_rule_prices').upsert(x,{onConflict:'rule_id,tier_id'});if(out.error)return err(out.error)}bg.remove();toast('Regra de estampa salva.','ok');await load()}}
function render(){drawNav();if(tab==='tiers')return renderTiers();if(tab==='comments')return renderComments();if(tab==='portfolio')return renderPortfolio();if(tab==='messages')return renderMessages();if(tab==='commissions')return renderCommissions();if(tab==='prints')return renderPrints();renderQuality()}
try{if(await auth()){await ensureLibrary();await load()}}catch(e){console.error(e);view.innerHTML=`<div class="empty"><h2>Não foi possível abrir o módulo</h2><p>${esc(e.message||e)}</p><a class="btn" href="/">Voltar ao sistema</a></div>`}
</script>

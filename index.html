<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="color-scheme" content="dark">
  <meta name="z19-version" content="2.16">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <title>019 Personalizações</title>
  <link rel="icon" href="/zero19-logo.png?v=2.16-logo2" type="image/png">
  <link rel="stylesheet" href="/styles.css?v=2.16-ui3">
</head>
<body>
  <div id="app">
    <div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#09090b;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
      <div style="text-align:center">
        <span style="display:inline-flex;background:#fff;border-radius:14px;padding:9px 13px;margin-bottom:18px">
          <img src="/zero19-logo.png?v=2.16-logo2" alt="Zero 19" style="width:180px;max-width:70vw;height:46px;object-fit:contain">
        </span>
        <div><b>Carregando sistema…</b></div>
        <small style="color:#92939d">Versão 2.16</small>
      </div>
    </div>
  </div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module">
    import('/app.js?v=2.16-ui3').catch((error) => {
      console.error(error);
      document.getElementById('app').innerHTML = `<div style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#09090b;color:#fff;font-family:system-ui"><div style="max-width:520px;text-align:center"><h2>Não foi possível iniciar o sistema</h2><p style="color:#9797a4">${String(error?.message || error || 'Erro inesperado')}</p><button onclick="location.reload()" style="border:0;border-radius:12px;background:#ff6428;color:#111;font-weight:800;padding:12px 18px">Tentar novamente</button></div></div>`;
    });
  </script>
</body>
</html>

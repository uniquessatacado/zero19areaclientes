name: Bootstrap v2.10 source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[skip bootstrap]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild stable source
        run: node scripts/bootstrap-v210.mjs
      - name: Validate JavaScript and boot architecture
        run: |
          node --check app.js
          ! grep -q 'DecompressionStream' index.html
          ! grep -q 'v28-p' index.html
          test -s styles.css
          test -s demo.html
      - name: Commit generated source
        run: |
          git config user.name 'zero19-version-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app.js styles.css index.html demo.html vercel.json PROJECT_MEMORY.md
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'v2.10: stable static source [skip bootstrap]'
          git push

name: Validate 019 Personalizacoes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and run release gates
        run: npm run build
      - name: Verify current release
        run: |
          grep -q 'content="2.17.33"' dist/index.html
          grep -q "APP_VERSION = '2.17.33'" dist/app.js
          grep -q 'createZero19PdvSync' dist/app.js
          grep -q 'Aguardando halftone' dist/zero19-pdv-sync.js
          grep -q 'AUTO 300 DPI' dist/app.js
          test -s dist/production-v217.js

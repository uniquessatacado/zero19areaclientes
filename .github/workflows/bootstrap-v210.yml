name: Validate 019 Personalizacoes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and run release gates
        run: npm run build
      - name: Verify current release
        run: |
          version=$(node -p "require('./package.json').version")
          grep -Fq "name=\"z19-version\" content=\"$version\"" dist/index.html
          grep -Fq "APP_VERSION = '$version'" dist/app.js
          test -s dist/venduss-artwork-archive.js
          grep -q 'createZero19PdvSync' dist/app.js
          grep -q 'Aguardando halftone' dist/zero19-pdv-sync.js
          grep -q 'AUTO 300 DPI' dist/app.js
          test -s dist/production-v217.js

name: Deploy 019 v2.17.8 production
on:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check Vercel credentials
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is missing"
            exit 21
          fi
          echo "Vercel token is present"

      - name: Validate application build
        run: npm run build

      - name: Link Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          printf '%s' '{"orgId":"team_88LTzdT7GLfKgRlzjvr1eF8c","projectId":"prj_cpZoh49CdDlYP0h82gwXCbR4nyw3"}' > .vercel/project.json

      - name: Deploy to Vercel production
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN" | tee vercel-deploy.log
          DEPLOY_URL=$(grep -Eo 'https://[^ ]+\.vercel\.app' vercel-deploy.log | tail -1)
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          test -n "$DEPLOY_URL"

      - name: Verify canonical production
        shell: bash
        run: |
          for i in {1..30}; do
            BODY=$(curl -fsSL -H 'Cache-Control: no-cache' "https://019-personalizacoes.vercel.app/?verify=2178-$i" || true)
            if printf '%s' "$BODY" | grep -q 'z19-version" content="2.17.8"'; then
              echo "019 production is v2.17.8"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Canonical domain did not reach v2.17.8"
          exit 22

# manual production redeploy trigger: 2026-09-20

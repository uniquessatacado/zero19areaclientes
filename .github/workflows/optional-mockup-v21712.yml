name: Optional mockup v2.17.12 verification
on:
  push:
    branches: ['fix/optional-mockup-v2.17.12']
    paths: ['.github/workflows/optional-mockup-v21712.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect mockup release guards and regression assertions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files=['app.js','production-v217.js','quote-service-core.js','quote-service-ui.js','project-advisor.js','queue-core.js','scripts/service-db-test.mjs',...fs.readdirSync('scripts').filter(n=>/^test-.*\.mjs$/.test(n)).map(n=>'scripts/'+n)];
          for(const file of files){
            const lines=fs.readFileSync(file,'utf8').split('\n');
            for(let i=0;i<lines.length;i++){
              const line=lines[i];
              if(!/mockup|Mockup|quotePreparationSummary/.test(line))continue;
              if(file==='app.js'||file==='production-v217.js'){
                if(!/ready|Ready|issues|Issues|pronto|Pronto|obrig|exig|oficial|pending|Pending|throw|return false|release|Release|check/.test(line))continue;
              }
              if(line.length>2500){let re=/.{0,180}(?:mockup|Mockup).{0,240}/g;for(const m of line.matchAll(re))console.log(file+':'+(i+1)+': '+m[0]);}
              else console.log(file+':'+(i+1)+': '+line);
            }
          }
          console.log('VERSION_CONFIG\n'+fs.readFileSync('index.html','utf8')+'\n'+fs.readFileSync('vercel.json','utf8'));
          console.log('APP_VERSION_LINES',fs.readFileSync('app.js','utf8').split('\n').filter(l=>l.includes('APP_VERSION')).join('\n'));
          NODE
      - name: Confirm existing release checks
        run: npm run build > /tmp/zero19-build.log 2>&1 || { tail -100 /tmp/zero19-build.log; exit 1; }
      - name: Report baseline
        run: tail -8 /tmp/zero19-build.log

<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><meta name="color-scheme" content="dark"><meta property="og:title" content="Demonstração de qualidade — Zero 19"><meta property="og:description" content="Assista à demonstração de qualidade preparada pela Zero 19."><meta property="og:type" content="video.other"><title>Demonstração de qualidade — Zero 19</title><style>:root{--bg:#09090b;--panel:#111114;--line:#292a30;--text:#f7f7f8;--muted:#9797a4;--accent:#ff5a1f;--accent2:#ff7a32}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 100% 0,#2a1208 0,transparent 27%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{min-height:100vh;padding:22px}.wrap{width:min(920px,100%);margin:0 auto}.brand{display:flex;align-items:center;gap:11px;margin-bottom:20px}.mark{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent2),var(--accent));color:#111;font-weight:950;font-style:italic;box-shadow:0 10px 26px rgba(255,90,31,.2)}.brand b{font-size:15px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.card{border:1px solid var(--line);border-radius:22px;background:linear-gradient(160deg,#151518,#0f0f11);box-shadow:0 18px 50px rgba(0,0,0,.34);overflow:hidden}.head{padding:20px 20px 16px}.eyebrow{color:var(--accent2);font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.12em}.head h1{margin:7px 0 8px;font-size:clamp(24px,5vw,38px);line-height:1.05;letter-spacing:-.035em}.head p{margin:0;color:#c9c9d0;font-size:14px;line-height:1.55;white-space:pre-wrap}.player{background:#000;position:relative;aspect-ratio:16/9;display:grid;place-items:center}.player video{width:100%;height:100%;object-fit:contain;background:#000}.foot{display:fl const SUPABASE_URL='https://kedggjyerexnzmipaick.supabase.co';const KEY='sb_publishable_WoobBV7n0p5Jf-4DLJVzIA_4sUoAvsT';
const card=document.getElementById('card');const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const pathUrl=p=>`${SUPABASE_URL}/storage/v1/object/public/z19p-assets/${String(p||'').split('/').map(encodeURIComponent).join('/')}`;

async function init(){try{const token=new URLSearchParams(location.search).get('t');if(!token)throw new Error('Link inválido.');const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/z19p_get_public_video_demo`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify({p_token:token})});if(!r.ok)throw new Error('Não foi possível abrir esta demonstração.');const d=await r.json();if(!d?.original_path)throw new Error('Demonstração indisponível.');const url=pathUrl(d.original_path),desc=d.description||d.name||'Demonstração de qualidade',ext=(d.mime_type||'video/mp4').includes('quicktime')?'mov':(d.mime_type||'').includes('webm')?'webm':'mp4';document.title=`${d.name} — Zero 19`;document.querySelector('meta[property="og:title"]').content=d.name||'Demonstração de qualidade — Zero 19';document.querySelector('meta[property="og:description"]').content=desc;card.innerHTML=`<div class="head"><div class="eyebrow">Demonstração de qualidade</div><h1>${esc(d.name)}</h1><p>${esc(desc)}</p><span class="quality">▶ Vídeo original • alta qualidade</span></div><div class="player"><video id="demoVideo" src="${esc(url)}" controls playsinline preload="auto"></video></div><div class="foot"><div class="meta">${fmt(d.size_bytes)}${d.duration?` • ${esc(d.duration)}s`:''}</div><button class="btn primary" id="download">↓ Baixar vídeo</button></div>`;document.getElementById('download').onclick=async()=>{const b=document.getElementById('download');const old=b.textContent;b.disabled=true;b.textContent='Preparando…';try{const rr=await fetch(url);if(!rr.ok)throw 0;const blob=await rr.blob(),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`${(d.name||'demonstracao').replace(/[^a-z0-9_-]+/gi,'-')}.${ext}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch{window.open(url,'_blank')}finally{b.disabled=false;b.textContent=old}}}catch(e){card.innerHTML=`<div class="error"><div><h2>Link indisponível</h2><p>${esc(e.message||'Não foi possível carregar o vídeo.')}</p></div></div>`}}init();
</script></body></html>
